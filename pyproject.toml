[project]
name = "log-intel"
version = "0.2.0.dev0"
description = "Log Intelligence Agent v2: cited root-cause hypotheses from logs with hybrid retrieval and evals (personal project)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.136",
    "httpx>=0.28",
    "numpy>=2.3",
    "pydantic-settings>=2",
    "python-multipart>=0.0.32",
    "typer>=0.20",
    "uvicorn>=0.49",
]

[project.scripts]
log-intel = "log_intel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/log_intel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI and Typer declare parameters through call defaults by design.
extend-immutable-calls = ["fastapi.File", "typer.Option", "typer.Argument"]
