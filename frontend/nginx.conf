server {
    listen 80;
    root /usr/share/nginx/html;

    # Headers are set per location: an add_header in a location drops the server-level ones.

    # Same contract as the dev proxy: /api/* goes to the FastAPI service without the prefix.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        client_max_body_size 21m;   # backend limit is 20 MB; let the API return the 413
        proxy_read_timeout 300s;    # CPU-only models can take a minute or more per answer
    }

    # Hashed build files never change, so they can be cached for good.
    location ~* \.(?:js|css|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri =404;
    }

    # Client-side routes (/history, /settings) fall back to the app.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}
